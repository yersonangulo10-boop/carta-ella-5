CTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<style>
:root{--bg-0:#0b0f1e;--bg-1:#2b3050;--ink:#ffe6ef;--muted:#b9bdd6;--accent:#ff8fb8;--paper:#f6ecdc;--paper-ink:#3b2b2f;--wine:#6a3050;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg-0);background:radial-gradient(ellipse at 50% 40%,var(--bg-1),var(--bg-0) 72%);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit}
/* Entrada: sobre */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:5;transition:opacity .8s,transform .8s}
#intro.gone{opacity:0;transform:scale(1.15);pointer-events:none}
#intro p{margin:0;color:var(--muted);font-size:.95rem;font-family:Georgia,"Times New Roman",serif;font-style:italic;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;border:0;padding:0;background:var(--wine);cursor:pointer;perspective:900px;box-shadow:0 30px 60px rgba(0,0,0,.5);border-radius:4px}
.env:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.sheet{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--paper);z-index:2;transition:transform .9s .55s;border-radius:2px}
.front{position:absolute;inset:0;background:linear-gradient(#7b3b5f,#4b1f38);clip-path:polygon(0 100%,0 30%,50% 62%,100% 30%,100% 100%);z-index:3}
.flap{position:absolute;left:0;top:0;width:100%;height:62%;background:linear-gradient(#8a4468,#6a3050);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s,z-index 0s .45s;z-index:5}
.seal{position:absolute;left:50%;top:56%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#c2385f;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35);z-index:6;display:grid;place-items:center;color:#ffd6e2;font-size:20px;transition:opacity .3s}
.opening .flap{transform:rotateX(180deg);z-index:1}
.opening .seal{opacity:0}
.opening .sheet{transform:translateY(-62%)}

/* Contenedor principal */
#main{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1s}
#main.show{opacity:1;visibility:visible}

/* Vista del corazón */
.heart-view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;padding:24px;box-sizing:border-box;
  transition:opacity .8s ease, transform .8s ease;
}
.heart-view.hide{opacity:0;transform:scale(.9);pointer-events:none}
.stage{position:relative;width:min(88vw,520px);height:min(62vh,520px)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

/* Botón Leer la carta */
.read-btn{
  position:relative;
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 34px;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.28);
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(6px);
  transition:transform .35s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 rgba(255,143,184,0);
}
.read-btn::before{
  content:"";width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}
.read-btn:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
  background:linear-gradient(180deg,rgba(255,143,184,.22),rgba(255,143,184,.06));
  box-shadow:0 14px 36px rgba(0,0,0,.4), 0 0 26px rgba(255,143,184,.35);
}
.read-btn:active{transform:translateY(0) scale(.98)}
.read-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* Vista de la carta — con márgenes amplios alrededor */
.letter-view{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:
    calc(env(safe-area-inset-top,0px) + 6vh)
    clamp(24px, 6vw, 90px)
    calc(env(safe-area-inset-bottom,0px) + 6vh);
  overflow:auto;box-sizing:border-box;
  opacity:0;visibility:hidden;transform:translateY(30px);
  transition:opacity .8s ease, transform .8s ease, visibility 0s .8s;
}
.letter-view.show{opacity:1;visibility:visible;transform:none;transition:opacity .8s ease, transform .8s ease}

/* Botón flotante de música */
.music-btn{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  right:14px;
  width:42px;height:42px;
  display:grid;place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.22);
  color:var(--ink);
  cursor:pointer;
  backdrop-filter:blur(6px);
  font-size:1.05rem;
  z-index:20;
  transition:background .3s, border-color .3s, transform .3s, color .3s;
  opacity:0;visibility:hidden;
}
#main.show .music-btn{opacity:1;visibility:visible;transition:opacity .8s .6s, visibility 0s .6s, background .3s, border-color .3s, transform .3s, color .3s}
.music-btn:hover{background:rgba(255,143,184,.18);border-color:var(--accent)}
.music-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.music-btn.off{color:var(--muted);opacity:.55}
.music-btn.off .wave{display:none}
.music-btn .slash{display:none}
.music-btn.off .slash{display:inline}
.music-btn.playing .wave{animation:waveAnim 1.2s ease-in-out infinite}
@keyframes waveAnim{0%,100%{opacity:1}50%{opacity:.35}}

/* ═══════════════════════════════════════════════════════════════
   CARTA ANTIGUA — Papel envejecido con manchas, doble marco
   y esquinas ornamentales
   ═══════════════════════════════════════════════════════════════ */
.paper{
  position:relative;
  width:100%;max-width:880px;      /* ← un poco más estrecha para que respire */
  color:var(--paper-ink);
  border-radius:3px;
  padding:clamp(64px,8vw,104px) clamp(46px,7vw,110px);
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  background:
    radial-gradient(ellipse 25% 18% at 12% 15%, rgba(139,90,43,.10) 0%, transparent 70%),
    radial-gradient(ellipse 20% 25% at 88% 78%, rgba(120,80,40,.09) 0%, transparent 70%),
    radial-gradient(circle at 92% 12%, rgba(106,48,80,.07) 0%, transparent 12%),
    radial-gradient(circle at 6% 92%, rgba(139,90,43,.08) 0%, transparent 14%),
    radial-gradient(ellipse 30% 20% at 50% 50%, rgba(255,250,235,.35) 0%, transparent 80%),
    linear-gradient(135deg,#f7ecd2 0%,#f0e1c2 30%,#f6ead0 55%,#ecdcb8 100%);
  box-shadow:
    0 40px 90px rgba(0,0,0,.6),
    0 6px 18px rgba(0,0,0,.35),
    inset 0 0 50px rgba(139,90,43,.14),
    inset 0 0 120px rgba(120,80,40,.10),
    inset 0 0 0 1px rgba(106,48,80,.15);
}
.paper-inner{
  position:relative;
  max-width:556px;
  margin:0 auto;
}
/* Doble marco decorativo */
.paper::before{
  content:"";
  position:absolute;
  inset:16px;
  border:1px solid rgba(106,48,80,.30);
  outline:1px solid rgba(106,48,80,.14);
  outline-offset:4px;
  border-radius:1px;
  pointer-events:none;
}
/* Esquinas ornamentales */
.paper::after{
  content:"";
  position:absolute;
  inset:8px;
  pointer-events:none;
  background:
    radial-gradient(circle 3px at 6px 6px, rgba(106,48,80,.4) 40%, transparent 50%),
    radial-gradient(circle 3px at calc(100% - 6px) 6px, rgba(106,48,80,.4) 40%, transparent 50%),
    radial-gradient(circle 3px at 6px calc(100% - 6px), rgba(106,48,80,.4) 40%, transparent 50%),
    radial-gradient(circle 3px at calc(100% - 6px) calc(100% - 6px), rgba(106,48,80,.4) 40%, transparent 50%);
}
.paper label{
  display:block;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
  opacity:.55;margin-bottom:6px;color:var(--wine);
}
.paper input{
  width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;
  font-family:inherit;font-size:1.08rem;padding:6px 0;outline:0;
  cursor:default;
}
/* Texto de la carta: div estático, sin scroll, crece con el contenido */
.body-text{
  font-family:inherit;
  font-size:1.08rem;
  line-height:1.85;
  margin:8px 0 18px;
  padding:0;
  color:inherit;
  white-space:pre-wrap;
  cursor:default;
  background-image:repeating-linear-gradient(transparent 0 1.83em,rgba(106,48,80,.10) 1.83em calc(1.85em + 1px));
  background-size:100% 1.85em;
  background-attachment:local;
}
.body-text::selection{background:rgba(255,143,184,.35)}
.paper input::selection{background:rgba(255,143,184,.35)}
#to{font-size:1.25rem;font-style:italic}
#from{text-align:right;font-style:italic;font-size:1.15rem}

/* Divisor ornamental */
.ornament{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:18px 0;
  color:rgba(106,48,80,.55);
  font-size:.8rem;letter-spacing:.4em;
  user-select:none;
}
.ornament::before,.ornament::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(to right, transparent, rgba(106,48,80,.35), transparent);
}
.ornament span{transform:translateY(-1px)}

/* Foto */
.photo-frame{
  position:relative;
  width:100%;
  margin: 4px auto 22px;
}
.photo-frame img{
  display:block;
  width:100%;
  height:auto;
  filter: sepia(.18) saturate(.9) contrast(1.04) brightness(.97);
  transition: filter .8s ease, transform .8s ease;
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 6%, #000 20%, #000 80%, rgba(0,0,0,.35) 94%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.35) 6%, #000 20%, #000 80%, rgba(0,0,0,.35) 94%, transparent 100%);
  -webkit-mask-composite: source-in;
          mask-image:
    linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 6%, #000 20%, #000 80%, rgba(0,0,0,.35) 94%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.35) 6%, #000 20%, #000 80%, rgba(0,0,0,.35) 94%, transparent 100%);
          mask-composite: intersect;
}
.photo-frame:hover img{ transform: scale(1.02); }

/* Botón volver */
.back-btn{
  display:block;margin:26px auto 0;
  padding:9px 22px;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);
  background:transparent;
  border:1px solid rgba(255,255,255,.15);
  border-radius:999px;
  cursor:pointer;
  transition:color .3s, border-color .3s, background .3s;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(255,143,184,.08)}
.back-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Móvil: márgenes más contenidos pero sin pegar a los bordes */
@media (max-width:820px){
  .stage{width:min(90vw,420px);height:min(55vh,420px)}
  .read-btn{padding:12px 28px;font-size:.78rem}
  .letter-view{
    padding:
      calc(env(safe-area-inset-top,0px) + 4vh)
      6vw
      calc(env(safe-area-inset-bottom,0px) + 6vh);
  }
  .paper{padding:52px 30px;max-width:100%;}
  .paper-inner{max-width:none;}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>

<!-- 🎵 MÚSICA — Reemplaza el src por el enlace de tu canción -->
<audio id="bgMusic" loop preload="auto"
       src="amarte.mpeg"></audio>

<div id="intro">
  <button class="env" id="env" type="button" aria-label="Abrir la carta y reproducir música">
    <div class="sheet"></div><div class="front"></div><div class="flap"></div><div class="seal">♥️</div>
  </button>
  <p></p>
</div>

<div id="main">

  <!-- Botón flotante de música -->
  <button id="musicBtn" class="music-btn" type="button" aria-label="Activar o silenciar música">
    <span class="wave">♪</span><span class="slash">✕</span>
  </button>

  <!-- Vista 1: solo el corazón -->
  <section class="heart-view" id="heartView">
    <div class="stage">
      <canvas id="c" aria-label="Corazón tridimensional formado por palabras que giran"></canvas>
    </div>
    <button id="readBtn" class="read-btn" type="button">Leer la carta</button>
  </section>

  <!-- Vista 2: la carta -->
  <section class="letter-view" id="letterView">
    <div>
      <article class="paper">
        <div class="paper-inner">

          <!-- 🖼️ FOTO — Reemplaza el src por el enlace de tu imagen -->
          <div class="photo-frame">
            <img id="letterPhoto"
                 src="foto1.jpeg"
                 alt=" ">
          </div>

          <div class="ornament"><span>❦</span></div>

          <label for="to">Para</label>
          <input id="to" value="derlin " maxlength="40" readonly>

          <div class="ornament"><span>✦</span></div>

          <!-- 📝 Texto de la carta: div estático sin scroll -->
          <div class="body-text" id="body" aria-label="Texto de la carta">Te amo frente de panela sos el amor de mi vida & esas foto es por que me encantan tus ojos Muakk ❤️.</div>

          <div class="ornament"><span>✦</span></div>

          <label for="from"> -</label>
          <input id="from" value="De parte de Yerson" maxlength="40" readonly>

        </div>
      </article>
      <button id="backBtn" class="back-btn" type="button">← Volver al corazón</button>
    </div>
  </section>

</div>

<script>
(function(){
  var intro=document.getElementById('intro'),env=document.getElementById('env'),main=document.getElementById('main');
  var heartView=document.getElementById('heartView'),letterView=document.getElementById('letterView');
  var readBtn=document.getElementById('readBtn'),backBtn=document.getElementById('backBtn');
  var musicBtn=document.getElementById('musicBtn'),bgMusic=document.getElementById('bgMusic');
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=cv.parentElement;
  var W=10,H=10,dpr=1,started=false,start=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ─── Música ─── */
  var musicOn=true;

  /* 🔁 Respaldo de loop por si el navegador ignora el atributo loop */
  bgMusic.addEventListener('ended', function(){
    if(musicOn){
      bgMusic.currentTime = 0;
      bgMusic.play().catch(function(){});
    }
  });

  function tryPlayMusic(){
    if(!bgMusic.getAttribute('src')||bgMusic.getAttribute('src').indexOf('AQUI_')===0){
      musicBtn.classList.add('off');
      musicOn=false;
      return;
    }
    var p=bgMusic.play();
    if(p&&p.then){
      p.then(function(){
        musicOn=true;
        musicBtn.classList.remove('off');
        musicBtn.classList.add('playing');
      }).catch(function(){
        musicOn=false;
        musicBtn.classList.add('off');
        musicBtn.classList.remove('playing');
      });
    }
  }

  musicBtn.addEventListener('click',function(){
    musicOn=!musicOn;
    if(musicOn){
      bgMusic.play().catch(function(){});
      musicBtn.classList.remove('off');
      musicBtn.classList.add('playing');
    } else {
      bgMusic.pause();
      musicBtn.classList.add('off');
      musicBtn.classList.remove('playing');
    }
  });

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=stage.clientWidth||10;H=stage.clientHeight||10;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
  addEventListener('resize',resize);resize();

  /* Abrir el sobre: doble función → reproduce música + abre la carta */
  function open(){
    if(started)return;started=true;

    /* ▶️ Dentro del gesto del clic, para que el navegador no lo bloquee */
    tryPlayMusic();

    intro.classList.add('opening');
    setTimeout(function(){
      intro.classList.add('gone');
      main.classList.add('show');
      resize();
      start=performance.now();
    },1700);
  }
  env.addEventListener('click',open);

  /* Navegación entre corazón y carta */
  readBtn.addEventListener('click',function(){
    heartView.classList.add('hide');
    letterView.classList.add('show');
  });
  backBtn.addEventListener('click',function(){
    letterView.classList.remove('show');
    heartView.classList.remove('hide');
  });

  var themes=[{glow:'255,143,184',ink:'255,232,240'},{glow:'130,200,255',ink:'232,245,255'},{glow:'255,200,120',ink:'255,244,226'},{glow:'190,150,255',ink:'244,236,255'}];
  var ti=0,phrase='Te amo Derlin';
  var N=46,pts=[];
  for(var i=0;i<N;i++){
    var t=i/N*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    for(var l=-2;l<=2;l++)pts.push({x:x,y:y,z:l*1.7,i:i,l:l});
  }
  var dust=[];for(var d=0;d<60;d++)dust.push({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,v:Math.random()*.02+.005,p:Math.random()*6.28});

  var rot=.4,pitch=0,yawOff=0,pitchT=0,yawT=0,vr=reduce?.08:.42,drag=false,lastX=0,pulse=0,prev=performance.now(),moved=0;
  function ease(v){v=Math.max(0,Math.min(1,v));return 1-Math.pow(1-v,3)}

  function frame(now){
    requestAnimationFrame(frame);
    var dt=Math.min(.05,(now-prev)/1000);prev=now;
    if(!started||!start)return;
    var t=(now-start)/1000,th=themes[ti];
    if(!drag)rot+=vr*dt;
    yawOff+=(yawT-yawOff)*Math.min(1,dt*4);pitch+=(pitchT-pitch)*Math.min(1,dt*4);pulse=Math.max(0,pulse-dt*1.6);
    ctx.clearRect(0,0,W,H);
    for(var d=0;d<dust.length;d++){var q=dust[d];q.y-=q.v*dt;if(q.y<-.02)q.y=1.02;
      ctx.fillStyle='rgba('+th.glow+','+(.15+.15*Math.sin(t*1.2+q.p))+')';ctx.beginPath();ctx.arc(q.x*W,q.y*H,q.s,0,6.283);ctx.fill()}
    var S=Math.min(W/38,H/38),beat=1+.045*Math.pow(Math.max(0,Math.sin(t*3.1)),6)+pulse*.12;
    var cx=W/2,cy=H/2+S*.2,a0=rot+yawOff,cr=Math.cos(a0),sr=Math.sin(a0),cp=Math.cos(pitch),sp=Math.sin(pitch),items=[];
    for(var k=0;k<pts.length;k++){
      var p=pts[k],rev=ease((t-.2-p.i*.045)/1.3);if(rev<=0)continue;
      var px=p.x*rev*beat,py=p.y*rev*beat,pz=p.z*beat;
      var x1=px*cr+pz*sr,z1=-px*sr+pz*cr,y2=py*cp-z1*sp,z2=py*sp+z1*cp,kf=48/(48-z2);
      items.push({sx:cx+x1*S*kf,sy:cy+y2*S*kf,z:z2,k:kf,l:p.l,rev:rev});
    }
    items.sort(function(a,b){return a.z-b.z});
    ctx.textAlign='center';ctx.textBaseline='middle';
    var base=Math.max(9,S*1.55);
    for(var m=0;m<items.length;m++){
      var it=items[m],depth=Math.max(.06,Math.min(1,.12+(it.k-.72)*1.05)),alpha=depth*it.rev*(1-Math.abs(it.l)*.16);
      ctx.font='600 '+(base*it.k).toFixed(1)+'px "Avenir Next","Segoe UI",system-ui,sans-serif';
      if(it.k>1.02){ctx.shadowColor='rgba('+th.glow+','+(alpha*.9)+')';ctx.shadowBlur=14*it.k}else ctx.shadowBlur=0;
      ctx.fillStyle='rgba('+th.ink+','+alpha.toFixed(3)+')';ctx.fillText(phrase,it.sx,it.sy);
    }
    ctx.shadowBlur=0;
  }
  requestAnimationFrame(frame);

  cv.addEventListener('pointerdown',function(e){drag=true;moved=0;lastX=e.clientX;cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',function(e){
    if(drag){var dx=e.clientX-lastX;lastX=e.clientX;moved+=Math.abs(dx);rot+=dx*.01}
    var r=cv.getBoundingClientRect();yawT=((e.clientX-r.left)/r.width-.5)*.5;pitchT=((e.clientY-r.top)/r.height-.5)*.45;
  });
  function up(){if(drag&&moved<6)pulse=1;drag=false}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',function(){yawT=0;pitchT=0});
})();
</script>
</body>
</html>
